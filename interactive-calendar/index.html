<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="简洁的在线交互日历，查看月份、点选日期并快速回到今天。">
  <title>在线交互日历</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 16px;
      background: #f3f4f6;
      gap: 14px;
    }
    .calendar-card {
      width: 380px;
      max-width: 100%;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.06);
      padding: 24px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      gap: 12px;
      flex-wrap: wrap;
    }
    .title {
      font-size: 1.15rem;
      font-weight: 600;
      color: #1f2937;
    }
    .controls { display: flex; gap: 4px; }
    .controls button {
      border: 1px solid #e5e7eb;
      background: #fff;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      color: #374151;
      transition: all 0.2s;
    }
    .controls button:hover {
      background: #f9fafb;
      border-color: #d1d5db;
    }
    .controls button:focus-visible { outline: 2px solid #2563eb; outline-offset: 2px; }
    .weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-size: 0.8rem;
      font-weight: 600;
      color: #9ca3af;
      margin-bottom: 10px;
    }
    .days-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
    }
    .day-cell {
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      border-radius: 8px;
      color: #374151;
      cursor: pointer;
      transition: background 0.15s;
    }
    .day-cell:not(.empty):hover {
      background: #f3f4f6;
    }
    .day-cell.empty {
      cursor: default;
    }
    .day-cell.today {
      background: #2563eb;
      color: #ffffff;
      font-weight: 600;
    }
    .day-cell.today:hover {
      background: #1d4ed8;
    }
    .day-cell.selected {
      box-shadow: inset 0 0 0 2px #2563eb;
      color: #1d4ed8;
      font-weight: 600;
    }
    .day-cell.selected.today {
      color: #ffffff;
    }
    .selection-note {
      font-size: 0.85rem;
      color: #6b7280;
      min-height: 1.2em;
    }
    .back-link {
      font-size: 0.85rem;
      color: #2563eb;
      text-decoration: none;
    }
    .back-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="calendar-card">
    <div class="header">
      <div class="title" id="monthDisplay" aria-live="polite">加载中...</div>
      <div class="controls">
        <button type="button" aria-label="上个月" onclick="changeMonth(-1)">◀</button>
        <button type="button" onclick="goToday()">今天</button>
        <button type="button" aria-label="下个月" onclick="changeMonth(1)">▶</button>
      </div>
    </div>
    <div class="weekdays">
      <div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div><div>日</div>
    </div>
    <div class="days-grid" id="daysGrid"></div>
  </div>
  <p class="selection-note" id="selectionNote" aria-live="polite"></p>
  <a class="back-link" href="../index.html">← 返回游戏大厅</a>

  <script>
    let currentYear, currentMonth;
    let selected = null; // { year, month, day }

    // 全部使用 UTC 正午构造日期，避免时区把月初/月末算错。
    function getCalendarData(year, month) {
      const now = new Date();
      const today = { year: now.getFullYear(), month: now.getMonth() + 1, day: now.getDate() };
      const y = year ?? today.year;
      const m = month ?? today.month;
      const first = new Date(0);
      first.setUTCHours(12, 0, 0, 0);
      first.setUTCFullYear(y, m - 1, 1);
      const last = new Date(0);
      last.setUTCHours(12, 0, 0, 0);
      last.setUTCFullYear(y, m, 0);
      const start = (first.getUTCDay() + 6) % 7; // 周一为一周开始
      const days = last.getUTCDate();
      const weeks = [];
      for (let row = 0; row < Math.ceil((start + days) / 7); row++) {
        const week = [];
        for (let column = 0; column < 7; column++) {
          const day = row * 7 + column - start + 1;
          week.push(day >= 1 && day <= days ? day : 0);
        }
        weeks.push(week);
      }
      return { year: y, month: m, today, weeks };
    }

    function loadCalendar(year, month) {
      const data = getCalendarData(year, month);

      currentYear = data.year;
      currentMonth = data.month;

      document.getElementById('monthDisplay').textContent = `${currentYear} 年 ${currentMonth} 月`;

      const grid = document.getElementById('daysGrid');
      grid.innerHTML = '';

      data.weeks.forEach(week => {
        week.forEach(day => {
          const cell = document.createElement('div');
          cell.className = 'day-cell';
          if (day === 0) {
            cell.classList.add('empty');
          } else {
            cell.textContent = day;
            const isToday = (
              currentYear === data.today.year &&
              currentMonth === data.today.month &&
              day === data.today.day
            );
            if (isToday) {
              cell.classList.add('today');
              cell.setAttribute('aria-current', 'date');
            }
            if (selected &&
                selected.year === currentYear &&
                selected.month === currentMonth &&
                selected.day === day) {
              cell.classList.add('selected');
              cell.setAttribute('aria-pressed', 'true');
            } else {
              cell.setAttribute('aria-pressed', 'false');
            }
            cell.setAttribute('role', 'button');
            cell.setAttribute('tabindex', '0');
            cell.addEventListener('click', () => selectDay(currentYear, currentMonth, day));
            cell.addEventListener('keydown', e => {
              if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                selectDay(currentYear, currentMonth, day);
              }
            });
          }
          grid.appendChild(cell);
        });
      });

      updateNote();
    }

    function selectDay(year, month, day) {
      selected = { year, month, day };
      loadCalendar(year, month);
    }

    function updateNote() {
      const note = document.getElementById('selectionNote');
      if (!selected) {
        note.textContent = '';
        return;
      }
      const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
      const d = new Date(0);
      d.setUTCHours(12, 0, 0, 0);
      d.setUTCFullYear(selected.year, selected.month - 1, selected.day);
      note.textContent = `已选择：${selected.year} 年 ${selected.month} 月 ${selected.day} 日 · 星期${weekdays[d.getUTCDay()]}`;
    }

    function changeMonth(offset) {
      currentMonth += offset;
      if (currentMonth < 1) {
        currentMonth = 12;
        currentYear -= 1;
      } else if (currentMonth > 12) {
        currentMonth = 1;
        currentYear += 1;
      }
      loadCalendar(currentYear, currentMonth);
    }

    function goToday() {
      loadCalendar();
    }

    loadCalendar();
  </script>
</body>
</html>
