<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI H5 游戏全功能在线大厅 - main.html</title>
    <meta name="description" content="AI H5 游戏大厅 - 支持多款 4399 / 网页游戏一键无缝切换在线预览播放器">
    <!-- 外部 CSS 样式表 -->
    <link rel="stylesheet" href="css/main.css">
</head>
<body>

    <!-- Top Navigation Bar -->
    <header class="top-navbar">
        <div class="brand">
            <span>🎮</span> AI H5 游戏大厅 (main.html)
        </div>
        <div class="current-game-title" id="current-title">
            <span>💥</span> 合金弹头 2
        </div>
        <div class="nav-actions">
            <div style="position:relative; display:inline-block;">
                <button class="action-btn" id="btn-layout-menu" onclick="$('#layout-menu').toggle();">🎨 切换布局模式 ▾</button>
                <div id="layout-menu" style="display:none; position:absolute; top:100%; right:0; margin-top:6px; background:#1f2937; border:1px solid #374151; border-radius:8px; padding:6px; z-index:1000; min-width:160px; box-shadow:0 10px 25px rgba(0,0,0,0.5);">
                    <a href="index.html" onclick="localStorage.setItem('h5_layout_mode', 'grid')" style="display:block; padding:8px 12px; color:#fff; text-decoration:none; font-size:13px; border-radius:4px;">🎛️ 1. 经典网格模式</a>
                    <a href="index.html" onclick="localStorage.setItem('h5_layout_mode', 'list')" style="display:block; padding:8px 12px; color:#fff; text-decoration:none; font-size:13px; border-radius:4px;">📜 2. 极简列表模式</a>
                    <a href="index.html" onclick="localStorage.setItem('h5_layout_mode', 'hero')" style="display:block; padding:8px 12px; color:#fff; text-decoration:none; font-size:13px; border-radius:4px;">👑 3. 巨幕大卡模式</a>
                    <a href="index.html" onclick="localStorage.setItem('h5_layout_mode', 'compact')" style="display:block; padding:8px 12px; color:#fff; text-decoration:none; font-size:13px; border-radius:4px;">📱 4. 紧凑小卡模式</a>
                    <a href="index.html" onclick="localStorage.setItem('h5_layout_mode', 'category')" style="display:block; padding:8px 12px; color:#fff; text-decoration:none; font-size:13px; border-radius:4px;">🗂️ 5. 分类大厅模式</a>
                </div>
            </div>
            <button class="action-btn" id="btn-share-game" style="background:rgba(16,185,129,0.2); border-color:#10b981; color:#10b981;">🔗 一键分享</button>
            <button class="action-btn" id="btn-view-code">📄 查看/复制源码</button>
            <button class="action-btn" id="btn-download-zip">💾 打包下载 (.zip)</button>
            <button class="action-btn" id="btn-reload">🔄 刷新游戏</button>
            <button class="action-btn" id="btn-open-tab">🔗 独立新标签打开</button>
            <button class="action-btn" id="btn-fullscreen">🖥️ 全屏大屏</button>
        </div>
    </header>

    <!-- Main Content Body -->
    <div class="app-body">
        <!-- Left Game Sidebar -->
        <aside class="sidebar">
            <div class="search-box">
                <input type="text" id="search-input" class="search-input" placeholder="🔍 搜索复刻游戏..." />
            </div>
            <div class="game-list" id="game-list">
                <!-- Dynamically populated by jQuery -->
            </div>
        </aside>

        <!-- Right Game Viewport -->
        <main class="viewport-area">
            <iframe id="game-iframe" src="metal-slug-2.html" allowfullscreen></iframe>
            <div class="notification" id="notif">已切换游戏！</div>
        </main>
    </div>

    <!-- 外部 JavaScript 依赖与业务逻辑导入 -->
    <script src="js/jquery.min.js"></script>
    <script src="js/jszip.min.js"></script>
    <script src="js/code-viewer-downloader.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
