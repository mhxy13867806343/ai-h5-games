<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI H5 游戏全功能在线大厅 - Vue 3 驱动版</title>
    <meta name="description" content="AI H5 游戏大厅 - 支持多款 4399 / 网页游戏一键无缝切换在线预览播放器 (Vue 3)">
    <!-- 外部 CSS 样式表 -->
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <div id="app">
        <!-- Top Navigation Bar -->
        <header class="top-navbar">
            <div class="brand">
                <span>🎮</span> AI H5 游戏大厅 (Vue 3.5)
            </div>
            <div class="current-game-title" id="current-title">
                <span>{{ currentGame.icon }}</span> {{ currentGame.name }}
            </div>
            <div class="nav-actions">
                <div style="position:relative; display:inline-block;">
                    <button class="action-btn" @click="toggleLayoutMenu">🎨 切换布局模式 ▾</button>
                    <div v-if="showLayoutMenu" class="layout-dropdown" style="position:absolute; top:100%; right:0; margin-top:6px; background:#1f2937; border:1px solid #374151; border-radius:8px; padding:6px; z-index:1000; min-width:160px; box-shadow:0 10px 25px rgba(0,0,0,0.5);">
                        <a v-for="item in layoutModes"
                           :key="item.mode"
                           href="javascript:void(0)"
                           @click="setLayoutMode(item.mode)"
                           style="display:block; padding:8px 12px; color:#fff; text-decoration:none; font-size:13px; border-radius:4px; transition:background 0.2s;"
                           onmouseenter="this.style.background='rgba(255,183,3,0.2)'"
                           onmouseleave="this.style.background='transparent'">
                           {{ item.label }}
                        </a>
                    </div>
                </div>
                <button class="action-btn" @click="shareGame" style="background:rgba(16,185,129,0.2); border-color:#10b981; color:#10b981;">🔗 一键分享</button>
                <button class="action-btn" @click="viewCode">📄 查看/复制源码</button>
                <button class="action-btn" @click="downloadZip">💾 打包下载 (.zip)</button>
                <button class="action-btn" @click="reloadGame">🔄 刷新游戏</button>
                <button class="action-btn" @click="openNewTab">🔗 独立新标签打开</button>
                <button class="action-btn" @click="toggleFullscreen">🖥️ 全屏大屏</button>
            </div>
        </header>

        <!-- Main Content Body -->
        <div class="app-body">
            <!-- Left Game Sidebar -->
            <aside class="sidebar">
                <div class="search-box">
                    <input type="text" v-model="searchQuery" class="search-input" placeholder="🔍 搜索复刻游戏..." />
                </div>
                <div class="game-list">
                    <div v-if="filteredGames.length === 0" style="text-align:center; padding:20px; color:#94a3b8; font-size:13px;">
                        未找到匹配游戏
                    </div>
                    <div v-for="game in filteredGames"
                         :key="game.id"
                         class="game-item"
                         :class="{ active: game.id === currentGame.id }"
                         @click="selectGame(game)">
                        <div class="icon">{{ game.icon }}</div>
                        <div class="info">
                            <div class="title">{{ game.name }}</div>
                            <div class="tag">{{ game.tag }}</div>
                        </div>
                    </div>
                </div>
            </aside>

            <!-- Right Game Viewport -->
            <main class="viewport-area">
                <iframe id="game-iframe" :src="currentGame.url" allowfullscreen></iframe>
                <div class="notification" :class="{ show: notificationShow }">
                    {{ notificationMsg }}
                </div>
            </main>
        </div>
    </div>

    <!-- 本地 Vue 3 核心库 (3.5.41) & 业务脚本 -->
    <script src="js/vue.global.js"></script>
    <script src="js/jszip.min.js"></script>
    <script src="js/code-viewer-downloader.js?v=3"></script>
    <script src="js/main.js"></script>
</body>
</html>
