<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#12100e">
<meta name="description" content="数字炸弹：0 到 N 之间藏着炸弹数字，2~5 人轮流报数收紧范围（任意真人/电脑组合），踩中或被迫只剩炸弹的人输。">
<title>数字炸弹 · Number Bomb</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231d1a16'/%3E%3Ccircle cx='16' cy='18' r='9' fill='%23e04b3a'/%3E%3Crect x='11' y='4' width='10' height='6' rx='2' fill='%23c8aa6d'/%3E%3Cpath d='M21 6l6-3' stroke='%23f0e6d2' stroke-width='2'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topnav">
  <span class="brand">💣 数字炸弹 <em>NUMBER BOMB</em></span>
  <button id="sound-toggle" class="sound-btn" aria-pressed="true" title="音效开关（M）">🔊 音效</button>
  <a class="nav-home" href="../index.html" onclick="return goLobby(this)">← 返回大厅</a>
</header>

<!-- 屏1 · 设置 -->
<section id="screen-setup" class="screen active">
  <div class="setup-card">
    <h1>0 到 N 之间，藏着一颗炸弹</h1>
    <p class="rules">2~5 人轮流在<b>当前范围内</b>报一个数：报小了，下界变为你报的数；报大了，上界变为你报的数。
    谁<b>直接踩中炸弹数字</b>，或轮到时<b>只剩炸弹一个数可报</b>，谁就输。每个座位可单独设为真人或电脑。</p>

    <div class="field">
      <label>人数</label>
      <div class="seg" id="count-seg">
        <button data-count="2">2 人</button>
        <button data-count="3" class="active">3 人</button>
        <button data-count="4">4 人</button>
        <button data-count="5">5 人</button>
      </div>
    </div>

    <div class="field">
      <label>玩家座位（勾选 🤖 = 该座位由电脑出战，不勾 = 真人输入）</label>
      <div id="player-rows"></div>
      <p class="seat-tip" id="seat-tip">当前阵容：3 人 · 1 真人 + 2 电脑</p>
    </div>

    <div class="field">
      <label>范围上限 N</label>
      <div class="seg" id="range-seg">
        <button data-n="1000" class="active">0 ~ 1000</button>
        <button data-n="10000">0 ~ 10000</button>
        <button data-n="custom">自定义…</button>
      </div>
      <input id="custom-n" type="number" min="10" max="999999" placeholder="输入 N（10 ~ 999999）" hidden>
    </div>

    <button id="btn-start" class="btn-start">💣 开始游戏</button>
  </div>
</section>

<!-- 屏2 · 游戏 -->
<section id="screen-game" class="screen">
  <div class="game-head">
    <button id="btn-quit" class="btn-ghost">← 退出</button>
    <div class="range-display">
      <span class="range-label">当前范围</span>
      <div class="range-num" id="range-num">( 0 , 1000 )</div>
      <span class="range-rest">还剩 <b id="rest-count">—</b> 个数可报</span>
    </div>
    <div class="round-chip">第 <b id="round-num">1</b> 轮</div>
  </div>

  <div class="players-strip" id="players-strip"></div>

  <div class="turn-banner" id="turn-banner">轮到 玩家 1 报数</div>
  <div class="announce" id="announce" aria-live="polite"></div>

  <div class="input-row" id="input-row">
    <input id="guess-input" type="number" inputmode="numeric" placeholder="报一个数" aria-label="报数">
    <button id="btn-guess" class="btn-guess">报数！</button>
  </div>
  <p class="input-hint" id="input-hint"></p>

  <div class="history">
    <div class="history-title">报数记录</div>
    <ul id="history-list"></ul>
    <p class="history-empty" id="history-empty">还没有人报数，你就是第一个</p>
  </div>
</section>

<!-- 屏3 · 爆炸结算 -->
<section id="screen-boom" class="screen">
  <div class="boom-card">
    <div class="boom-icon" id="boom-icon">💥</div>
    <div class="boom-title" id="boom-title">踩中炸弹！</div>
    <div class="boom-loser" id="boom-loser">玩家 1 输了</div>
    <div class="boom-target">炸弹数字是 <b id="boom-target">—</b></div>
    <div class="boom-stats" id="boom-stats"></div>
    <div class="boom-actions">
      <button id="btn-again">💣 再来一局</button>
      <button id="btn-setup2">⚙ 更改设置</button>
      <a class="btn-home2" href="../index.html" onclick="return goLobby(this)">🏠 返回大厅</a>
    </div>
  </div>
</section>

<script src="app.js"></script>
</body>
</html>
