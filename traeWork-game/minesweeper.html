<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>经典扫雷 (Minesweeper) - traeWork-game 专区</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #111827; color: #fff; font-family: -apple-system, sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh;
        }
        .header {
            width: 100%; max-width: 480px; padding: 15px 20px; background: #1f2937; border-bottom: 2px solid #38bdf8;
            display: flex; align-items: center; justify-content: space-between; position: fixed; top: 0;
        }
        .logo { font-weight: 900; color: #38bdf8; font-size: 18px; text-decoration: none; }
        .nav-btn {
            padding: 6px 12px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
            border-radius: 20px; color: #fff; text-decoration: none; font-size: 12px; cursor: pointer;
        }
        .game-panel {
            background: #1f2937; border: 2px solid #374151; border-radius: 12px; padding: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5); margin-top: 70px;
        }
        .panel-top {
            display: flex; justify-content: space-between; align-items: center; background: #111827;
            padding: 10px 20px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #374151;
        }
        .digital-counter { font-family: monospace; font-size: 24px; color: #ef4444; font-weight: bold; }
        .face-btn { font-size: 24px; cursor: pointer; background: none; border: none; }
        .board { display: grid; grid-template-columns: repeat(10, 36px); gap: 4px; }
        .cell {
            width: 36px; height: 36px; background: #374151; border-radius: 4px;
            display: flex; align-items: center; justify-content: center; font-weight: bold;
            font-size: 16px; cursor: pointer; user-select: none; transition: background 0.2s;
        }
        .cell:hover { background: #4b5563; }
        .cell.revealed { background: #1f2937; border: 1px solid #374151; }
        .cell.mine { background: #ef4444; }
        .c-1 { color: #3b82f6; } .c-2 { color: #10b981; } .c-3 { color: #ef4444; }
        .c-4 { color: #8b5cf6; } .c-5 { color: #f59e0b; }
    </style>
</head>
<body>
    <div class="header">
        <a href="../index.html" class="logo">📂 traeWork-game / 经典扫雷</a>
        <div>
            <a href="../index.html" class="nav-btn">🏠 返回大厅</a>
            <button onclick="window.history.back()" class="nav-btn">⬅️ 返回上一页</button>
        </div>
    </div>

    <div class="game-panel">
        <div class="panel-top">
            <div class="digital-counter" id="mine-count">010</div>
            <button class="face-btn" id="face-btn" onclick="initGame()">🙂</button>
            <div class="digital-counter" id="timer">000</div>
        </div>
        <div class="board" id="board"></div>
    </div>

    <script>
        const ROWS = 10, COLS = 10, MINES = 10;
        let board = [], revealedCount = 0, gameOver = false, timer = 0, timerInterval = null;

        function initGame() {
            clearInterval(timerInterval);
            timer = 0; gameOver = false; revealedCount = 0;
            document.getElementById('timer').textContent = '000';
            document.getElementById('mine-count').textContent = '010';
            document.getElementById('face-btn').textContent = '🙂';

            board = Array(ROWS).fill().map(() => Array(COLS).fill().map(() => ({
                isMine: false, revealed: false, flagged: false, count: 0
            })));

            let placed = 0;
            while (placed < MINES) {
                let r = Math.floor(Math.random() * ROWS), c = Math.floor(Math.random() * COLS);
                if (!board[r][c].isMine) {
                    board[r][c].isMine = true;
                    placed++;
                }
            }

            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (board[r][c].isMine) continue;
                    let cnt = 0;
                    for (let dr = -1; dr <= 1; dr++) {
                        for (let dc = -1; dc <= 1; dc++) {
                            let nr = r + dr, nc = c + dc;
                            if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && board[nr][nc].isMine) cnt++;
                        }
                    }
                    board[r][c].count = cnt;
                }
            }
            renderBoard();
        }

        function renderBoard() {
            const boardEl = document.getElementById('board');
            boardEl.innerHTML = '';
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    const cellData = board[r][c];

                    if (cellData.revealed) {
                        cell.classList.add('revealed');
                        if (cellData.isMine) {
                            cell.classList.add('mine');
                            cell.textContent = '💣';
                        } else if (cellData.count > 0) {
                            cell.textContent = cellData.count;
                            cell.classList.add('c-' + cellData.count);
                        }
                    } else if (cellData.flagged) {
                        cell.textContent = '🚩';
                    }

                    cell.onclick = () => reveal(r, c);
                    cell.oncontextmenu = (e) => { e.preventDefault(); flag(r, c); };
                    boardEl.appendChild(cell);
                }
            }
        }

        function startTimer() {
            if (!timerInterval) {
                timerInterval = setInterval(() => {
                    timer++;
                    document.getElementById('timer').textContent = String(Math.min(999, timer)).padStart(3, '0');
                }, 1000);
            }
        }

        function reveal(r, c) {
            if (gameOver || board[r][c].revealed || board[r][c].flagged) return;
            startTimer();
            board[r][c].revealed = true;

            if (board[r][c].isMine) {
                gameOver = true;
                clearInterval(timerInterval);
                document.getElementById('face-btn').textContent = '😵';
                revealAllMines();
                renderBoard();
                return;
            }

            revealedCount++;
            if (board[r][c].count === 0) {
                for (let dr = -1; dr <= 1; dr++) {
                    for (let dc = -1; dc <= 1; dc++) {
                        let nr = r + dr, nc = c + dc;
                        if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) reveal(nr, nc);
                    }
                }
            }

            if (revealedCount === ROWS * COLS - MINES) {
                gameOver = true;
                clearInterval(timerInterval);
                document.getElementById('face-btn').textContent = '😎';
            }
            renderBoard();
        }

        function flag(r, c) {
            if (gameOver || board[r][c].revealed) return;
            board[r][c].flagged = !board[r][c].flagged;
            renderBoard();
        }

        function revealAllMines() {
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (board[r][c].isMine) board[r][c].revealed = true;
                }
            }
        }

        initGame();
    </script>
</body>
</html>
